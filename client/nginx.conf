server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so each tab address
    # (/compare, /miss, /watch, /api) loads directly (E-1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the server container on the internal network.
    # Note: "/api" on its own is the API tab page (served by the SPA above);
    # only paths under "/api/" and "/v1/" go to the server.
    # Without this exact match nginx would redirect "/api" to "/api/" (the proxy
    # location below) and the API tab could not be opened directly.
    location = /api {
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://moon-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://moon-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The assistant connector (Model Context Protocol).
    location = /mcp {
        proxy_pass http://moon-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

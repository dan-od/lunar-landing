server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so each tab address
    # (/compare, /miss, /watch, /api) loads directly (E-1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the server container on the internal network.
    location /api/ {
        proxy_pass http://moon-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# Moon Status: own compose project (homelab conventions in AGENTS.md).
# - Only the public-facing container (client) joins the shared external `web` network.
# - The database joins the internal network only.
# - No published ports; containers expose to the proxy / each other only.
# - Every container has a container_name and a health check on 127.0.0.1.

name: moon-status

services:
  client:
    container_name: moon-client
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web
      - internal
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  server:
    container_name: moon-server
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Separate values, read directly by node-postgres, so the password never
      # has to be valid inside a URL.
      PGHOST: moon-db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      HORIZONS_API_URL: ${HORIZONS_API_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    expose:
      - "8080"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    container_name: moon-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    networks:
      - internal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web:
    external: true
  # The stack's own private network. It is not on the shared proxy network, but
  # it must allow outbound traffic: the server calls NASA Horizons from here.
  # (Docker's "internal: true" would block that.)
  internal:
    name: moon-internal

volumes:
  db-data:

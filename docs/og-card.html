<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@900&family=Overpass:wght@400;600&family=Fira+Code:wght@400&display=block">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#07173F;color:#fff;font-family:Overpass,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px;border:6px solid #2E96F5}
.top{display:flex;align-items:center;gap:22px;font:900 44px 'Fira Sans',sans-serif;letter-spacing:.12em}

.tag.ok{background:#EAFE07;color:#07173F;border-color:#EAFE07}

<div><h1>Will a lunar lander have <span>power</span> and a line to <span>Earth</span>?</h1>

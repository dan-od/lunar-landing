# Deploys Moon Status production (moon.okoro.me) to the homelab.
# Runs on a push to main, or by hand. Nothing is deployed from any other branch.
#
# Repository secrets this workflow expects (names only; values live in GitHub):
#   TS_OAUTH_CLIENT_ID   Tailscale OAuth client id, to join the tailnet as tag:ci
#   TS_OAUTH_SECRET      Tailscale OAuth secret
#   DEPLOY_HOST          tailnet address of the homelab host
#   DEPLOY_USER          SSH user on that host
#   DEPLOY_SSH_KEY       private ed25519 key for that user
#   DEPLOY_KNOWN_HOSTS   the host's public key line(s), from `ssh-keyscan -t ed25519 <host>`
#   MOON_DB_PASSWORD     PostgreSQL password. It is passed to the server as a
#                        separate value, never inside a URL. PostgreSQL only reads
#                        it the first time the database volume is created; changing
#                        it later does not change the password of an existing database.
#   EMAIL_SENDING_KEY    Resend API key for watch emails. Email alerts stay off unless
#                        both this and TOKEN_SIGNING_SECRET are set.
#   TOKEN_SIGNING_SECRET long random text that keys the stored hashes of watch links
#
# One-time step on the host, not done by this workflow: copy nginx/moon.conf to
# /opt/docker-homelab/nginx/sites/moon.conf and reload nginx-proxy.

name: Deploy moon
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-moon
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' \
            --exclude='data' --exclude='tools/terrain/.venv' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/docker-homelab/sites/moon/
      # Every variable docker-compose.yml reads. The password, the email key and
      # the signing secret are secrets; an empty value leaves email alerts off.
      - name: Write .env
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "umask 077; cat > /opt/docker-homelab/sites/moon/.env" <<'EOF'
          POSTGRES_USER=moon
          POSTGRES_DB=moonstatus
          POSTGRES_PASSWORD=${{ secrets.MOON_DB_PASSWORD }}
          HORIZONS_API_URL=https://ssd.jpl.nasa.gov/api/horizons.api
          PUBLIC_SITE_URL=https://moon.okoro.me
          EMAIL_SENDING_KEY=${{ secrets.EMAIL_SENDING_KEY }}
          TOKEN_SIGNING_SECRET=${{ secrets.TOKEN_SIGNING_SECRET }}
          EMAIL_FROM=Moon Status <moon@okoro.me>
          EOF
      - name: Build and restart
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'DEPLOY'
            set -e
            cd /opt/docker-homelab/sites/moon
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker ps --filter name=moon --format 'table {{.Names}}\t{{.Status}}'
          DEPLOY
      # The server does not create its own tables. Each of these is safe to run
      # on every deploy: migrations apply once, sites are upserted, the terrain
      # profiles for the demo site are replaced with the committed file, and the
      # cache seed asks NASA Horizons (one request at a time) only for hours not saved.
      - name: Migrate and seed
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'DEPLOY'
            set -e
            cd /opt/docker-homelab/sites/moon
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' moon-server)" = "healthy" ] && break
              sleep 2
            done
            # Each exec gets an empty input. Without it, exec reads the rest of
            # this script from the SSH session and the later commands never run.
            docker compose exec -T server node server/dist/db/migrate.js < /dev/null
            docker compose exec -T server node server/dist/sites/seed.js < /dev/null
            docker compose exec -T server node server/dist/terrain/loadTerrain.js < /dev/null
            docker compose exec -T server node server/dist/cache/seedCache.js < /dev/null
            # Fail the step if the seeds did not land.
            sites=$(docker compose exec -T db psql -U moon -d moonstatus -tAc 'SELECT count(*) FROM sites' < /dev/null)
            hours=$(docker compose exec -T db psql -U moon -d moonstatus -tAc 'SELECT count(*) FROM position_cache' < /dev/null)
            profiles=$(docker compose exec -T db psql -U moon -d moonstatus -tAc 'SELECT count(*) FROM horizon_profiles' < /dev/null)
            echo "sites in database: $sites, cached position hours: $hours, terrain profiles: $profiles"
            [ "$sites" -ge 5 ]
            [ "$hours" -ge 1 ]
            [ "$profiles" -ge 1 ]
          DEPLOY
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS -o /dev/null -w '%{http_code}\n' https://moon.okoro.me/api/health
          curl -fsS -o /dev/null -w '%{http_code}\n' https://moon.okoro.me/v1/sites

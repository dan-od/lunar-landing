# Moon Status (production) — copy to /opt/docker-homelab/nginx/sites/moon.conf
# (Homelab Hosting Playbook: one site file per address).
# Tunnel public hostname moon.okoro.me -> http://nginx-proxy:80 -> this server
# block -> moon-client:80. moon-client serves the built front end and passes
# /api/ and /v1/ to moon-server on the stack's internal network.
#
# Production is public: no sign-in in front of this address.
# Real client IPs are set globally by 00-real-ip.conf; don't repeat that here.
# nginx-proxy reaches moon-client over the shared external "web" network, which
# is the only network the public-facing container joins besides its own.
server {
    listen 80;
    server_name moon.okoro.me;

    # Resolve at request time through Docker DNS, so nginx-proxy still starts
    # (and every other site stays up) if this container is down or not built yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://moon-client:80;

    # Requests are small: query strings and, later, a short JSON body for a watch.
    client_max_body_size 64k;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The server rate-limits per visitor from this header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A first request for an unsaved span waits on NASA Horizons, one request at a time.
        proxy_read_timeout 120s;
    }
}
